name: probe-gemelnet
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe open data
        shell: bash
        run: |
          set +e
          R=a30dcbea-a1d2-482c-ae29-8f781f5025fb
          g() { curl -sS -m 90 -G "https://data.gov.il/api/3/action/datastore_search" --data-urlencode "resource_id=$R" --data-urlencode "filters=$1" --data-urlencode "limit=${2:-1000}" -o "$3"; echo "::notice title=size-$3::$(wc -c < $3)"; }
          g '{"FUND_CLASSIFICATION":"קופת גמל להשקעה - חסכון לילד","REPORT_PERIOD":202609}' 1000 b.json
          echo "::notice title=fields::$(jq -c '[.result.fields[].id]' b.json | head -c 3000)"
          echo "::notice title=rec::$(jq -c '.result.records[0]' b.json | head -c 3500)"
          echo "::notice title=spec::$(jq -r '[.result.records[] | "\(.SPECIALIZATION)/\(.SUB_SPECIALIZATION)"] | group_by(.) | map("\(.[0])=\(length)") | join(";")' b.json | head -c 3500)"
          g '{"FUND_CLASSIFICATION":"קופת גמל להשקעה","REPORT_PERIOD":202609}' 1000 a.json
          echo "::notice title=specA::$(jq -r '[.result.records[] | "\(.SPECIALIZATION)/\(.SUB_SPECIALIZATION)"] | group_by(.) | map("\(.[0])=\(length)") | join(";")' a.json | head -c 3500)"
          echo "::notice title=harel::$(jq -c '[.result.records[] | select(.FUND_NAME|test("הראל")) | select(.FUND_NAME|test("500"))][0]' a.json | head -c 3000)"
