name: probe-gemelnet
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe open data
        shell: bash
        run: |
          set +e
          R=a30dcbea-a1d2-482c-ae29-8f781f5025fb
          U="https://data.gov.il/api/3/action/datastore_search"
          for UA in "Moments-family-app" "Dalvik/2.1.0 (Linux; U; Android 16; SM-S938B Build/BP2A.250605.031.A3)" "curl/8"; do
            o=$(curl -sS -m 90 -A "$UA" -w ' code=%{http_code} t=%{time_total}' -G "$U" --data-urlencode "resource_id=$R" --data-urlencode "fields=REPORT_PERIOD" --data-urlencode "sort=REPORT_PERIOD desc" --data-urlencode "limit=1" | tail -c 200 | tr '\n' ' ')
            echo "::notice title=latest $UA::$o"
            o=$(curl -sS -m 90 -A "$UA" -w ' code=%{http_code} t=%{time_total}' -G "$U" --data-urlencode "resource_id=$R" --data-urlencode 'filters={"FUND_CLASSIFICATION":"קופת גמל להשקעה","REPORT_PERIOD":202609}' --data-urlencode "fields=FUND_ID,FUND_NAME" --data-urlencode "limit=2000" | tail -c 150 | tr '\n' ' ')
            echo "::notice title=cands $UA::$o"
            o=$(curl -sS -m 90 -A "$UA" -w ' code=%{http_code} t=%{time_total}' -G "$U" --data-urlencode "resource_id=$R" --data-urlencode 'filters={"FUND_ID":13414}' --data-urlencode "fields=REPORT_PERIOD,MONTHLY_YIELD" --data-urlencode "sort=REPORT_PERIOD desc" --data-urlencode "limit=400" | tail -c 150 | tr '\n' ' ')
            echo "::notice title=yields $UA::$o"
          done
