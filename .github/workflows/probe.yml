name: probe-gemelnet
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe open data
        shell: bash
        run: |
          set +e
          R=a30dcbea-a1d2-482c-ae29-8f781f5025fb
          g() { curl -sS -m 90 -G "https://data.gov.il/api/3/action/datastore_search" --data-urlencode "resource_id=$R" --data-urlencode "filters=$1" --data-urlencode "limit=${2:-1000}" -o "$3"; echo "::notice title=size-$3::$(wc -c < $3) $(head -c 60 $3 | tr '\n' ' ')"; }
          g '{"FUND_CLASSIFICATION":"קופת גמל להשקעה","REPORT_PERIOD":202609}' 1000 a.json
          echo "::notice title=sp500::$(jq -r '.result.records[]? | "\(.FUND_ID)|\(.FUND_NAME)|\(.MONTHLY_YIELD)|\(.YEAR_TO_DATE_YIELD)"' a.json | grep '500' | tr '\n' ';' | head -c 3000)"
          g '{"FUND_CLASSIFICATION":"קופת גמל להשקעה - חסכון לילד","REPORT_PERIOD":202609}' 1000 b.json
          echo "::notice title=child::$(jq -r '.result.records[]? | "\(.FUND_ID)|\(.FUND_NAME)|\(.MONTHLY_YIELD)|\(.YEAR_TO_DATE_YIELD)"' b.json | tr '\n' ';' | head -c 3500)"
          for ID in $(jq -r '.result.records[]? | select(.FUND_NAME|test("הראל")) | select(.FUND_NAME|test("500")) | .FUND_ID' a.json); do
            g "{\"FUND_ID\":$ID}" 100 f$ID.json
            echo "::notice title=fund-$ID::$(jq -r '[.result.records[]? | select(.REPORT_PERIOD>=202601)] | sort_by(.REPORT_PERIOD) | .[] | "\(.REPORT_PERIOD):\(.MONTHLY_YIELD)"' f$ID.json | tr '\n' ' ')"
          done
