name: probe-gemelnet
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe open data
        shell: bash
        run: |
          set +e
          R=a30dcbea-a1d2-482c-ae29-8f781f5025fb
          g() { curl -sS -m 90 -G "https://data.gov.il/api/3/action/datastore_search" --data-urlencode "resource_id=$R" --data-urlencode "filters=$1" --data-urlencode "limit=${2:-1000}" -o "$3"; }
          L=$(curl -sS -G "https://data.gov.il/api/3/action/datastore_search" --data-urlencode "resource_id=$R" --data-urlencode "fields=REPORT_PERIOD" --data-urlencode "sort=REPORT_PERIOD desc" --data-urlencode "limit=1" | jq -r '.result.records[0].REPORT_PERIOD')
          echo "::notice title=latest::$L"
          g "{\"FUND_CLASSIFICATION\":\"קופת גמל להשקעה\",\"REPORT_PERIOD\":$L}" 2000 a.json
          echo "::notice title=harel::$(jq -r '.result.records[] | select(.FUND_NAME|test("הראל")) | "\(.FUND_ID)|\(.FUND_NAME)"' a.json | tr '\n' ';' | head -c 3500)"
          g "{\"FUND_CLASSIFICATION\":\"קופת גמל להשקעה - חסכון לילד\",\"REPORT_PERIOD\":$L}" 2000 b.json
          echo "::notice title=harelchild::$(jq -r '.result.records[] | select(.FUND_NAME|test("הראל")) | "\(.FUND_ID)|\(.FUND_NAME)"' b.json | tr '\n' ';' | head -c 3500)"
          echo "::notice title=alt::$(jq -r '.result.records[] | select(.FUND_NAME|test("אלטשולר")) | "\(.FUND_ID)|\(.FUND_NAME)"' a.json | tr '\n' ';' | head -c 3500)"
