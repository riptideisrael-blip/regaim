name: probe-gemelnet
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe open data
        run: |
          set +e
          n() { echo "::notice title=$1::$(echo "$2" | head -c 3000 | tr '\n' ' ' | sed 's/%/%25/g')"; }
          P=$(curl -sS -m 30 "https://data.gov.il/api/3/action/package_show?id=gemelnet")
          n resources "$(echo "$P" | jq -c '[.result.resources[]|{id,name,format,last_modified,datastore_active}]')"
          for R in $(echo "$P" | jq -r '.result.resources[]|select(.datastore_active==true)|.id'); do
            D=$(curl -sS -m 60 "https://data.gov.il/api/3/action/datastore_search?resource_id=$R&limit=1")
            n "fields-$R" "$(echo "$D" | jq -c '[.result.fields[].id]')"
            n "total-$R" "$(echo "$D" | jq -c '.result.total')"
            n "sample-$R" "$(echo "$D" | jq -c '.result.records[0]')"
            Q=$(curl -sS -m 60 -G "https://data.gov.il/api/3/action/datastore_search" --data-urlencode "resource_id=$R" --data-urlencode "q=S&P 500" --data-urlencode "limit=40")
            n "sp500-$R" "$(echo "$Q" | jq -c '[.result.records[]|del(._full_text)]' | head -c 2900)"
          done
