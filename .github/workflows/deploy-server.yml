name: Deploy server functions (Supabase)

# Runs only when you press "Run workflow" (Actions → Deploy server functions → Run workflow): that press is the approval.
# Before uploading, it saves what is running on the server now (download it from the run's page: "server-backup").
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   name SUPABASE_ACCESS_TOKEN, value = a token from supabase.com → Account → Access Tokens.
# SQL files are NOT run here: those stay manual in the SQL Editor.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Which functions (cartoon-film, ai, or both)"
        required: true
        default: "cartoon-film ai"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: acqgmcmvxijyijhgivnt
      WANTED: ${{ inputs.functions }}
    steps:
      - uses: actions/checkout@v4

      # The repository holds the app as one zip (regaim-app.zip): the server files are inside it.
      - name: Unzip
        run: unzip -oq regaim-app.zip

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the setup and the names
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing the SUPABASE_ACCESS_TOKEN secret (see the top of this file)."; exit 1
          fi
          LIST=""
          for f in $WANTED; do
            case "$f" in
              cartoon-film|ai) LIST="$LIST $f" ;;
              *) echo "::error::Unknown function: $f (only cartoon-film, ai)"; exit 1 ;;
            esac
          done
          echo "LIST=$LIST" >> "$GITHUB_ENV"

      - name: Back up what runs on the server now
        run: |
          mkdir -p backup && cd backup
          for f in $LIST; do
            supabase functions download "$f" --project-ref "$PROJECT_REF" --use-api || echo "could not download $f (new function?)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: server-backup
          path: backup/
          retention-days: 90
          if-no-files-found: warn

      - name: Deploy
        run: |
          mkdir -p work/supabase/functions
          for f in $LIST; do cp -r "regaim-app/server/functions/$f" work/supabase/functions/; done
          cd work
          for f in $LIST; do
            echo "Deploying $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
          done
