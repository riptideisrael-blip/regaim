<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>סיסמה חדשה · Moments</title>
<meta name="theme-color" content="#F7F9FC">
<style>
  :root { --bg: #F7F9FC; --ink: #0F1B2D; --soft: #4F5B6D; --line: #DDE4EE; --accent: #1A62B8; --error: #B3261E; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 480px; padding: 28px 16px 64px; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif; line-height: 1.6; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { font-size: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-top: 16px; }
  label { display: block; font-weight: 600; margin-top: 12px; }
  input { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; margin-top: 6px; border: 1px solid #6B7A8F; border-radius: 12px; background: #fff; color: var(--ink); }
  button { width: 100%; min-height: 48px; margin-top: 18px; border: 0; border-radius: 14px; background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
  button[disabled] { opacity: .6; }
  .soft { color: var(--soft); font-size: 14px; }
  .msg { margin-top: 14px; font-weight: 600; }
  .msg.err { color: var(--error); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .skip { position: absolute; inset-inline-start: -9999px; top: 8px; background: #fff; padding: 8px 12px; border-radius: 8px; min-height: 44px; display: inline-flex; align-items: center; color: var(--accent); }
  .skip:focus { inset-inline-start: 16px; }
  .show { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 10px; font-weight: 400; }
  .show input { width: 22px; height: 22px; margin: 0; }
  .foot a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }
  .foot { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
  .foot a { color: var(--accent); }
</style>
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן</a>
<main id="main">
<h1>בחירת סיסמה חדשה</h1>
<p class="soft">Moments · לחשבון שביקש איפוס סיסמה</p>

<div class="card" id="formCard" hidden>
  <form id="form" novalidate>
    <label for="pw1">סיסמה חדשה (לפחות 8 תווים)</label>
    <input id="pw1" type="password" autocomplete="new-password" minlength="8" required aria-describedby="msg">
    <label for="pw2">שוב, כדי לוודא</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required aria-describedby="msg">
    <label class="show" for="show"><input id="show" type="checkbox"> הצגת הסיסמאות</label>
    <button id="save" type="submit">שמירת הסיסמה</button>
  </form>
</div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>

<nav class="foot" aria-label="קישורים">
  <a href="terms.html">תנאי שימוש</a>
  <a href="privacy.html">מדיניות פרטיות</a>
  <a href="accessibility.html">הצהרת נגישות</a>
</nav>

<script>
(() => {
  // The app's server (the public, publishable key: it only allows what the server's rules allow).
  const SERVER = "https://acqgmcmvxijyijhgivnt.supabase.co";
  const KEY = "sb_publishable_MLvfYGP3BD_liOe_8g-TEg_MN3ZU1bm";
  const $ = (id) => document.getElementById(id);
  const say = (text, error) => {
    $("msg").setAttribute("role", error ? "alert" : "status");
    $("msg").textContent = text; $("msg").className = "msg" + (error ? " err" : "");
  };
  const wrong = (id, text) => {
    ["pw1", "pw2"].forEach((f) => $(f).removeAttribute("aria-invalid"));
    $(id).setAttribute("aria-invalid", "true");
    $(id).focus();
    // Said after the focus moves (so moving the focus doesn't cut the message off).
    setTimeout(() => say(text, true), 60);
  };

  // The email link brings a one-time sign-in in the address (#access_token=...&type=recovery). It's read once and
  // removed from the address right away, so it isn't left in the history or shared by mistake.
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get("access_token");
  const type = params.get("type");
  if (location.hash) history.replaceState(null, "", location.pathname);

  if (params.get("error") || params.get("error_description")) {
    say("הקישור כבר לא בתוקף (הוא עובד פעם אחת ולזמן קצר). בקשו קישור חדש מהאפליקציה: \"שכחתי סיסמה\".", true);
    return;
  }
  if (!token || type !== "recovery") {
    say("כדי לבחור סיסמה חדשה, פתחו את הקישור מהמייל ששלחנו. אפשר לבקש מייל כזה באפליקציה: \"שכחתי סיסמה\".", true);
    return;
  }
  $("formCard").hidden = false;
  $("pw1").focus();
  // Seeing what was typed helps avoid mistakes (and people who can't type blind).
  $("show").onchange = () => ["pw1", "pw2"].forEach((f) => { $(f).type = $("show").checked ? "text" : "password"; });

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const a = $("pw1").value, b = $("pw2").value;
    if (a.length < 8) { wrong("pw1", "הסיסמה צריכה להיות לפחות 8 תווים"); return; }
    if (a !== b) { wrong("pw2", "שתי הסיסמאות לא זהות"); return; }
    ["pw1", "pw2"].forEach((f) => $(f).removeAttribute("aria-invalid"));
    $("save").disabled = true;
    say("שומרים...");
    try {
      const res = await fetch(SERVER + "/auth/v1/user", {
        method: "PUT",
        headers: { "apikey": KEY, "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ password: a })
      });
      if (!res.ok) {
        const t = (await res.text()).toLowerCase();
        if (t.includes("same") || t.includes("different")) throw new Error("זו הסיסמה הקודמת. בחרו סיסמה אחרת.");
        if (res.status === 401 || res.status === 403) throw new Error("הקישור כבר לא בתוקף. בקשו קישור חדש מהאפליקציה: \"שכחתי סיסמה\".");
        if (res.status === 422) throw new Error("הסיסמה לא מתאימה. נסו סיסמה ארוכה יותר.");
        throw new Error("לא הצלחנו לשמור. נסו שוב בעוד רגע.");
      }
      $("formCard").hidden = true;
      say("✓ הסיסמה עודכנה. חזרו לאפליקציה Moments והתחברו עם הסיסמה החדשה.");
    } catch (err) {
      $("save").disabled = false;
      say(err.message || "לא הצלחנו לשמור. נסו שוב בעוד רגע.", true);
    }
  };
})();
</script>
</body>
</html>
