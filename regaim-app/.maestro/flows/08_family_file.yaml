appId: com.regaim.app.qa
name: The family file opens from the family tab, and asks for consent before the first item
---
- runFlow: ../common/home.yaml
- tapOn:
    id: "tabFamily"
- scrollUntilVisible:
    element:
      text: "Family file"
    direction: DOWN
    timeout: 10000
- tapOn: "Family file"
- extendedWaitUntil:
    visible: "The file is empty"
    timeout: 10000
- takeScreenshot: 08_family_file
- tapOn: "Add"
- extendedWaitUntil:
    visible: ".*what's kept, and where.*"
    timeout: 10000
- takeScreenshot: 08_family_file_consent
- tapOn: "Not now"
- assertVisible: "The file is empty"
- assertVisible: "Savings"
- tapOn: "Import Excel"
- extendedWaitUntil:
    visible: ".*what's kept, and where.*"
    timeout: 10000
- tapOn: "Not now"
- assertVisible: "The file is empty"
# The savings screen opens and draws (portfolio, calculator) after consent.
- tapOn: "Savings"
- extendedWaitUntil:
    visible: ".*what's kept, and where.*"
    timeout: 10000
- tapOn: "I agree"
- extendedWaitUntil:
    visible: "Calculator: how much there could be"
    timeout: 10000
- assertVisible: "The family's savings"
- takeScreenshot: 08_savings
