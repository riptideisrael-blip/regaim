appId: com.regaim.app.qa
name: Pitzki's screen opens, with the parent gate before the settings
---
- runFlow: ../common/home.yaml
# Pitzki lives in the Studio tab (not on the home screen).
- tapOn:
    id: "tabStudio"
- scrollUntilVisible:
    element:
      text: ".*Pitzki · a learning program.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*Pitzki · a learning program.*"
- extendedWaitUntil:
    visible: "Hi, I'm Pitzki"
    timeout: 20000
- takeScreenshot: 04_pitzki
# The settings ask a grown-up first (a sum): the gate must be there.
- scrollUntilVisible:
    element:
      text: ".*Settings.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*⚙️.*"
- takeScreenshot: 04_parent_gate
- back
