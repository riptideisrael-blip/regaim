appId: com.regaim.app.qa
name: Sign-in has Forgot password, and its window asks for the email (nothing is sent)
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- tapOn:
    text: "Skip"
    optional: true
- scrollUntilVisible:
    element:
      text: ".*I already have an account.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*I already have an account.*"
- scrollUntilVisible:
    element:
      text: "Forgot password"
    direction: DOWN
    timeout: 15000
- tapOn: "Forgot password"
- assertVisible: "Reset password"
- takeScreenshot: 06_forgot_password
# Without an email the window stays open and says why (nothing goes to the server).
- tapOn: "Send"
- assertVisible: "Reset password"
- tapOn: "Cancel"
